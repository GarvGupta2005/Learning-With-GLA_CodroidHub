<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 - Form Styling with State Handling</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Assignment 8</h1>

    <h2>C2. Form Styling with State Handling</h2>

    <form>

        <label for="name">Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required>

        <label for="email">Email</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <label for="password">Password</label><br>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>

        <label for="disabled">Disabled Field</label><br>
        <input
            type="text"
            id="disabled"
            value="You cannot edit this field"
            disabled>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
